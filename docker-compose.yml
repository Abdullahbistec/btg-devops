# Runs the dashboard (with its in-process scheduler, web/lib/scheduler.ts)
# as a persistent container — the internal replacement for the removed
# GitHub Actions cron. `restart: always` is what makes this "internal":
# Docker restarts the container on crash or host reboot, so the 60s poller
# inside the app keeps running without any external trigger.
#
# Points DATABASE_URL at your own Postgres (managed or self-hosted) — this
# does not bundle a database, since production Postgres is expected to
# already exist separately (see web/.env.local.example).
services:
  btg-devops:
    build: .
    restart: always
    ports:
      - "3000:3000"
      - "8090:8090"
    env_file:
      - web/.env.local
    environment:
      # Overrides web/.env.local's CLAUDE_DRAIN_ENABLED=1 for this container
      # specifically. The image has no `claude` CLI and no credentials, so
      # leaving the flag on would mean every Summarize click spawns a
      # process that can't exist (ENOENT), caught by the existing try/catch
      # in routine-trigger.ts, and the request just sits pending forever
      # with nothing on screen explaining why. Disabled beats silently
      # broken. See docs/docker-claude-drain.md for what real support would
      # require (installing the CLI, plus mounting a Claude account's
      # credentials into a server container — a decision for whoever owns
      # that account, not a default).
      - CLAUDE_DRAIN_ENABLED=0
      # Overrides web/.env.local's BTG_DEVOPS_PATH=../btg-devops.exe, which is
      # only correct for the Windows host this repo is developed on. The
      # Dockerfile's `go build` runs with no GOOS override, producing a
      # plain `btg-devops` binary (no .exe) at /app/btg-devops -- inheriting
      # the Windows path here via env_file made every `analyze` command AND
      # the auto-started MCP server (web/lib/mcp-runner.ts) fail with ENOENT
      # inside the container, since /app/btg-devops.exe never exists.
      - BTG_DEVOPS_PATH=../btg-devops
      # The MCP server needs to be reachable from outside the container for
      # an external Claude Code session (with the real CLI + credentials,
      # per docs/docker-claude-drain.md) to drain the queue -- 3000:3000
      # alone only exposes the dashboard.
      - MCP_ADDR=:8090
