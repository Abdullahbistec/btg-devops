name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLI Engine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: CLI Engine/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: CLI Engine
