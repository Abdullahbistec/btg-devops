name: Deploy Dashboard to Vercel

# Automates what has been a manual `vercel --prod` deploy until now — a push
# to production with dashboard changes now deploys itself instead of relying
# on someone remembering to run the CLI. VERCEL_ORG_ID/VERCEL_PROJECT_ID
# aren't secret (they're plain project identifiers, already visible in
# dashboard/.vercel/project.json which is gitignored per-machine) but are
# passed as repo secrets anyway so this workflow doesn't hardcode them.
on:
  push:
    branches: [production]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
