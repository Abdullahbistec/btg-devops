name: Security Gates

# Security/quality gates only — deployment is Docker-based and lives elsewhere.
# Mirrors scripts/security-check.sh so local and CI stay in sync.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the code.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (not mutable tags) — supply-chain hardening.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run security gates
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          bash scripts/security-check.sh
