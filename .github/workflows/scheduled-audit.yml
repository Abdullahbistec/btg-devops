name: Scheduled Governance Audit

# Runs the analyzers on a fixed schedule instead of ad hoc/manual re-runs —
# this is what actually addresses "Azure hits the rate limit" (spacing runs
# out), not a code change. Azure SDK calls already retry 429s with backoff
# by default; this just stops runs from stacking on top of each other.
on:
  schedule:
    - cron: '0 6 * * *'   # once daily, 06:00 UTC
  workflow_dispatch: {}    # manual "Run workflow" button, same job

jobs:
  audit:
    runs-on: ubuntu-latest
    # GitHub Actions disallows referencing `secrets` directly inside an `if:`
    # expression (it errors with "Unrecognized named-value: 'secrets'") —
    # secrets are only readable from `env:`/`with:` contexts, so each
    # existence check is computed here once and read back via `env.*` below.
    env:
      HAS_AZURE_CREDS: ${{ secrets.AZURE_TENANT_ID != '' }}
      HAS_PP_CREDS: ${{ secrets.AZURE_TENANT_ID != '' || secrets.BTG_PP_TENANT_ID != '' }}
      HAS_HETZNER_TOKEN: ${{ secrets.HCLOUD_TOKEN != '' }}
      # Both secrets are required for the Claude-based engine to actually
      # work: ANTHROPIC_API_KEY for the `claude -p` CLI, MCP_BEARER_TOKEN for
      # the MCP server runMCP() (cmd/mcp.go) refuses to start without. Gating
      # on ANTHROPIC_API_KEY alone let CI install the Claude CLI and attempt
      # to start a server that immediately failed for lack of a bearer token
      # — silently, since the server was backgrounded and the step never
      # checked whether it actually came up.
      HAS_CLAUDE_ENGINE: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.MCP_BEARER_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build -o btg-devops .

      - name: Install Claude Code CLI
        if: ${{ env.HAS_CLAUDE_ENGINE == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Start MCP server
        if: ${{ env.HAS_CLAUDE_ENGINE == 'true' }}
        env:
          MCP_BEARER_TOKEN: ${{ secrets.MCP_BEARER_TOKEN }}
        run: |
          ./btg-devops mcp --http --addr :8090 &
          curl --fail --silent --show-error --retry 5 --retry-delay 1 \
            http://localhost:8090/mcp \
            -H "Authorization: Bearer $MCP_BEARER_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -X POST \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-healthcheck","version":"1.0"}}}' \
            || (echo "::error::MCP server failed to start" && exit 1)

      # If either secret is missing (HAS_CLAUDE_ENGINE false), the Claude
      # CLI/MCP steps above are skipped entirely and every service's
      # analysis call fails to spawn claude at all — which is exactly the
      # "spawn error" fallback path (see cmd/storage.go's runStorageAnalysis),
      # so the audit still completes fully rule-based, matching today's
      # behavior with zero configuration required. If both secrets ARE set
      # but the server still fails to come up, the health check above fails
      # this step loudly instead of letting the job go green while silently
      # running 100% rule-based.
      - name: Run Azure analyzers
        if: ${{ env.HAS_AZURE_CREDS == 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./btg-devops analyze all --scope azure --output json > azure-findings.json
        continue-on-error: true

      - name: Run Power Platform analyzers
        if: ${{ env.HAS_PP_CREDS == 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.BTG_PP_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.BTG_PP_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.BTG_PP_CLIENT_SECRET || secrets.AZURE_CLIENT_SECRET }}
        run: ./btg-devops analyze all --scope pp --output json > pp-findings.json
        continue-on-error: true

      - name: Run Hetzner analyzers
        if: ${{ env.HAS_HETZNER_TOKEN == 'true' }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./btg-devops analyze hetzner --output json > hetzner-findings.json
        continue-on-error: true

      - name: Upload findings as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-findings-${{ github.run_id }}
          path: |
            azure-findings.json
            pp-findings.json
            hetzner-findings.json
          if-no-files-found: ignore
          retention-days: 90

      # No-ops cleanly (exit 0) until DASHBOARD_BASE_URL is configured —
      # nothing is deployed publicly yet, so this stays inert by design.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Push results into the live dashboard, if deployed
        env:
          DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/run-scheduled-audit.js

      - name: Request a daily cost refresh, if deployed
        if: ${{ !cancelled() }}
        env:
          DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/run-scheduled-cost-refresh.js

      - name: Report failure
        if: failure()
        run: echo "::error::Scheduled governance audit had a failing step — check the logs above."
